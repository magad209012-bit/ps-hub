<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mohamed Ramadan - PS4 Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: radial-gradient(
                circle at center,
                #0a1128 0%,
                #000411 100%
            );

            color: #fff;

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            min-height: 100vh;
            padding: 20px;
        }

        .page {
            min-height: calc(100vh - 40px);

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 1000px;

            background: rgba(255, 255, 255, 0.03);

            border: 1px solid rgba(0, 150, 255, 0.25);

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 0 30px rgba(0, 100, 255, 0.15);
        }

        /* HEADER */

        .header {
            text-align: center;

            padding: 35px 20px 28px;

            background: rgba(4, 10, 25, 0.75);

            border-bottom:
                1px solid
                rgba(0, 150, 255, 0.2);
        }

        .logo {
            width: 90px;
            height: 90px;

            object-fit: contain;

            display: block;

            margin: 0 auto 15px;

            filter:
                drop-shadow(
                    0 0 15px
                    rgba(0, 210, 255, 0.45)
                );
        }

        .title {
            font-size: 26px;

            font-weight: 700;

            letter-spacing: 3px;

            color: #00d2ff;

            text-shadow:
                0 0 10px
                rgba(0, 210, 255, 0.45);

            margin-bottom: 6px;
        }

        .subtitle {
            color: #8fa3bf;

            font-size: 14px;
        }

        /* CONTENT */

        .content {
            padding: 25px;
        }

        #state {
            font-size: 22px;

            font-weight: 700;

            text-align: center;

            margin-bottom: 15px;

            color: #e5c56e;
        }

        #state.ok {
            color: #70e0a0;
        }

        #state.bad {
            color: #ff817d;
        }

        #state.warn {
            color: #e5c56e;
        }

        /* OUTPUT */

        #out {
            width: 100%;

            min-height: 380px;

            max-height: 65vh;

            overflow: auto;

            white-space: pre-wrap;

            word-break: break-word;

            direction: ltr;

            text-align: left;

            padding: 18px;

            background: #050a14;

            border:
                1px solid
                rgba(0, 210, 255, 0.18);

            border-radius: 12px;

            color: #c8d2e3;

            font:
                13px/1.7
                Consolas,
                "Courier New",
                monospace;
        }

        /* BUTTON */

        .back {
            display: block;

            width: 100%;

            margin-top: 16px;

            padding: 14px;

            border:
                1px solid
                rgba(0, 210, 255, 0.45);

            border-radius: 10px;

            background: #101c31;

            color: #00d2ff;

            text-decoration: none;

            text-align: center;

            font-size: 15px;

            font-weight: 700;

            transition: 0.25s ease;
        }

        .back:hover {
            background: #142640;

            box-shadow:
                0 0 15px
                rgba(0, 210, 255, 0.15);
        }

        /* FOOTER */

        .footer {
            text-align: center;

            padding: 15px;

            color: #5d6d7e;

            font-size: 12px;

            border-top:
                1px solid
                rgba(0, 150, 255, 0.15);
        }

        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .page {
                min-height:
                    calc(100vh - 20px);
            }

            .header {
                padding: 25px 15px;
            }

            .logo {
                width: 75px;
                height: 75px;
            }

            .title {
                font-size: 21px;
                letter-spacing: 2px;
            }

            .content {
                padding: 15px;
            }

            #state {
                font-size: 19px;
            }

            #out {
                min-height: 320px;

                font-size: 12px;

                padding: 13px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <main class="container">

        <!-- HEADER -->

        <header class="header">

            <img
                src="./logo.png"
                alt="Mohamed Ramadan"
                class="logo"
            >

            <h1 class="title">
                MOHAMED RAMADAN
            </h1>

            <p class="subtitle">
                PlayStation 4 Hub &amp; Tools
            </p>

        </header>


        <!-- CONTENT -->

        <section class="content">

            <div
                id="state"
                class="warn"
            >
                جاري تشغيل الصفحة...
            </div>

            <div id="out"></div>

            <a
                href="./index.html"
                class="back"
            >
                العودة إلى الصفحة الرئيسية
            </a>

        </section>


        <!-- FOOTER -->

        <footer class="footer">
            © 2026 Mohamed Ramadan
        </footer>

    </main>

</div>


<script>
(() => {

    "use strict";

    const state =
        document.getElementById("state");

    const out =
        document.getElementById("out");


    function log(text) {

        if (!out) return;

        out.textContent +=
            String(text) + "\n";

        out.scrollTop =
            out.scrollHeight;
    }


    function setState(text, type) {

        if (!state) return;

        state.textContent = text;

        state.className =
            type || "warn";
    }


    setState(
        "جاري تشغيل الصفحة...",
        "warn"
    );


    log(
        "MOHAMED RAMADAN - PS4 HUB"
    );

    log(
        "--------------------------------"
    );

    log(
        "تم تحميل واجهة الصفحة."
    );

    log(
        "URL: " + location.href
    );

    log("");


    window.addEventListener(
        "error",
        function (event) {

            log(
                "[PAGE ERROR] " +
                (
                    event.message ||
                    "Unknown error"
                )
            );

        }
    );


    window.addEventListener(
        "unhandledrejection",
        function (event) {

            log(
                "[PROMISE ERROR] " +
                (
                    event.reason?.message ||
                    event.reason ||
                    "Unknown rejection"
                )
            );

        }
    );

})();
</script>

</body>
</html>
