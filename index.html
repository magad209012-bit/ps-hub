<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Ramadan - PlayStation Portal</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- لوجو الموقع -->
        <div class="logo-box">
            <img src="logo.png" alt="Mohamed Ramadan Logo" class="logo-img">
        </div>

        <h1 class="title">MOHAMED RAMADAN</h1>
        <p class="subtitle">PlayStation 4 Hub & Tools</p>

        <!-- كارت حالة الجهاز -->
        <div class="status-card">
            <div class="status-indicator" id="indicator"></div>
            <span id="status-text">جاري فحص الجهاز...</span>
        </div>

        <!-- أزرار الواجهة -->
        <div class="button-grid">
            <button class="btn" onclick="checkDevice(true)">فحص سريع للنظام (Quick Scan)</button>
            <button class="btn btn-secondary" onclick="openToolsModal()">لوحة الأدوات (Tools Dashboard)</button>
        </div>

        <footer>
            <p>© 2026 Mohamed Ramadan. All rights reserved.</p>
        </footer>
    </div>

    <!-- نافذة الأدوات المنبثقة (Tools Modal) -->
    <div class="modal-overlay" id="toolsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>لوحة الأدوات والنظام</h2>
                <button class="close-btn" onclick="closeToolsModal()">✕</button>
            </div>
            
            <div class="tools-grid">
                <!-- اختيار الإصدار -->
                <div class="tool-item">
                    <label>إصدار النظام (Firmware Target):</label>
                    <select id="fwSelect" onchange="saveFWPreference()">
                        <option value="auto">تحديد تلقائي (Auto Detect)</option>
                        <option value="9.00">Firmware 9.00</option>
                        <option value="11.00">Firmware 11.00</option>
                        <option value="other">إصدار آخر</option>
                    </select>
                </div>

                <!-- تفاصيل العرض والعتاد -->
                <div class="tool-item info-box">
                    <p><strong>دقة الشاشة:</strong> <span id="screenRes">--</span></p>
                    <p><strong>أنوية المعالج:</strong> <span id="cpuCores">--</span></p>
                    <p><strong>وضع الشبكة:</strong> <span id="netStatus">--</span></p>
                </div>

                <!-- زر مسح الكاش للتحديث -->
                <div class="tool-item">
                    <button class="btn-action" onclick="clearAppCache()">تحديث ملفات الهوست (Clear Cache)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // فحص المتصفح والجهاز
        function checkDevice(showAlert = false) {
            const ua = navigator.userAgent;
            const statusText = document.getElementById('status-text');
            const indicator = document.getElementById('indicator');

            let isPS4 = ua.includes("PlayStation 4");

            if (isPS4) {
                statusText.innerText = "متصل بنجاح من جهاز: PlayStation 4";
                indicator.style.background = "#00ff66";
            } else {
                statusText.innerText = "الجهاز الحالي ليس PlayStation 4";
                indicator.style.background = "#ffaa00";
            }

            if (showAlert) {
                alert(isPS4 ? "الجهاز متوافق مع نظام PlayStation 4!" : "تنبيه: أنت تتصفح من منصة أخرى، بعض الخصائص قد تختلف.");
            }
        }

        // فتح وإغلاق لوحة الأدوات
        function openToolsModal() {
            document.getElementById('toolsModal').classList.add('active');
            // قراءة مواصفات العرض
            document.getElementById('screenRes').innerText = `${window.screen.width} x ${window.screen.height}`;
            document.getElementById('cpuCores').innerText = navigator.hardwareConcurrency || "غير متاح";
            document.getElementById('netStatus').innerText = navigator.onLine ? "متصل بالإنترنت (Online)" : "أوفلاين من الكاش (Offline)";
        }

        function closeToolsModal() {
            document.getElementById('toolsModal').classList.remove('active');
        }

        // حفظ تفضيل الإصدار
        function saveFWPreference() {
            const val = document.getElementById('fwSelect').value;
            localStorage.setItem('target_fw', val);
        }

        // مسح الكاش
        function clearAppCache() {
            if ('caches' in window) {
                caches.keys().then(names => {
                    for (let name of names) caches.delete(name);
                    alert("تم مسح الكاش بنجاح، سيتم إعادة التحميل.");
                    window.location.reload();
                });
            }
        }

        // صوت نقرة البلايستيشن
        function playClickSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', playClickSound);
        });

        // تشغيل الـ Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered:', reg.scope))
                    .catch(err => console.warn('SW Error:', err));
            });
        }

        window.onload = () => {
            checkDevice();
            const saved = localStorage.getItem('target_fw');
            if (saved) document.getElementById('fwSelect').value = saved;
        };
        <!DOCTYPE html>
<html lang="en" manifest="cache.appcache">

</html>

</body>
</html>
