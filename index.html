<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Ramadan - PlayStation Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- شعار الموقع -->
        <div class="logo-box">
            <img src="logo.png" alt="Mohamed Ramadan Logo" class="logo-img">
        </div>

        <!-- معلومات الموقع -->
        <h1 class="title">MOHAMED RAMADAN</h1>
        <p class="subtitle">PlayStation 4 Hub & Tools</p>

        <!-- صندوق فحص المتصفح والحالة -->
        <div class="status-card">
            <div class="status-indicator" id="indicator"></div>
            <span id="status-text">جاري فحص الجهاز والمتصفح...</span>
        </div>

        <!-- أزرار الخدمات أو الروابط -->
        <div class="button-grid">
            <button class="btn" onclick="checkDevice()">فحص النظام (System Info)</button>
            <button class="btn btn-secondary" onclick="alert('قريباً!')">الأدوات (Tools)</button>
        </div>

        <footer>
            <p>© 2026 Mohamed Ramadan. All rights reserved.</p>
        </footer>
    </div>

    <script>
        function checkDevice() {
            const ua = navigator.userAgent;
            const statusText = document.getElementById('status-text');
            const indicator = document.getElementById('indicator');

            if (ua.includes("PlayStation 4")) {
                statusText.innerText = "متصل بنجاح من جهاز: PlayStation 4";
                indicator.style.background = "#00ff66";
            } else {
                statusText.innerText = "الجهاز الحالي ليس PlayStation 4 (المتصفح: " + navigator.userAgentData?.platform || "PC/Mobile" + ")";
                indicator.style.background = "#ffaa00";
            }
        }

        // تشغيل الفحص تلقائياً عند فتح الصفحة
        window.onload = checkDevice;
    </script>
</body>
</html>
